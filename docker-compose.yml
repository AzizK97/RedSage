version: '3.8'

services:
  chatbot-postgres:
    image: postgres:16
    container_name: chatbot-postgres
    restart: always
    environment:
      POSTGRES_DB: redmine_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"                    # Different port from Langfuse
    volumes:
      - chatbot_postgres_data:/var/lib/postgresql/data

  chatbot-redis:
    image: redis:7
    container_name: chatbot-redis
    restart: always
    ports:
      - "6380:6379"                    # Different port from Langfuse
    volumes:
      - chatbot_redis_data:/data

volumes:
  chatbot_postgres_data:
  chatbot_redis_data: